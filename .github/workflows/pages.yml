name: Publish demo

on:
  push:
    branches: [main, pages-data]
    paths:
      - "docs/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * *" # daily, after the 09:00 UTC close, in case the oracle's trigger failed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # the oracle publishes current levels, history and closes to the
      # pages-data branch (oracle/src/publish.js); use them when present
      - name: Use the latest site data
        run: |
          if git fetch --depth=1 origin pages-data; then
            git archive FETCH_HEAD data | tar -x -C docs
            echo "site data from pages-data: $(git log -1 --format=%s FETCH_HEAD)"
          else
            echo "no pages-data branch yet: using docs/data from main"
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
