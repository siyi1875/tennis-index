[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 10_000_000
fs_permissions = [{ access = "read", path = "./"}]

[rpc_endpoints]
spicy = "${SPICY_RPC_URL}"

[invariant]
runs = 100
depth = 200
shrink_run_limit = 5000

[etherscan]
spicy = { key = "${SPICY_ETHERSCAN_KEY}", url = "https://api.routescan.io/v2/network/testnet/evm/88882/etherscan/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
